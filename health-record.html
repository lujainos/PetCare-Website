<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السجل الصحي | بُسيس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="padding-top: 30px;">

<div class="container fade-up visible">

    <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>

    <header class="page-header">
        <div class="section-label">ملف طبي</div>
        <h1 class="section-title">السجل <em>الصحي</em></h1>
        <p class="section-desc">تابع الحالة الصحية لقطتك وسجّل كل التفاصيل الطبية بدقة — يُحفظ تلقائياً في جهازك.</p>
    </header>

    <div class="record-layout">

        <div class="calc-box">
            <h3 class="calc-title">إضافة سجل جديد</h3>

            <div class="form-group">
                <label class="form-label">التاريخ</label>
                <input type="date" class="form-input" id="rec-date">
            </div>
            <div class="form-group">
                <label class="form-label">نوع الإجراء</label>
                    <select class="form-select" id="rec-type">
                    <option value="vaccine">تطعيم دوري</option>
                    <option value="checkup">فحص عام</option>
                    <option value="dental">تنظيف أسنان</option>
                    <option value="medication">دواء أو علاج</option>
                    <option value="surgery">عملية أو إجراء</option>
                    <option value="emergency">طوارئ</option>
                    <option value="other">أخرى</option>
                </select>
                <div class="record-type-key" aria-hidden="true">
                    <span title="تطعيم"><i class="fas fa-syringe"></i></span>
                    <span title="فحص"><i class="fas fa-stethoscope"></i></span>
                    <span title="أسنان"><i class="fas fa-tooth"></i></span>
                    <span title="دواء"><i class="fas fa-pills"></i></span>
                    <span title="إجراء"><i class="fas fa-kit-medical"></i></span>
                    <span title="طوارئ"><i class="fas fa-truck-medical"></i></span>
                    <span title="أخرى"><i class="fas fa-file-lines"></i></span>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">اسم الإجراء</label>
                <input type="text" class="form-input" id="rec-title" placeholder="مثال: تطعيم الثلاثي">
            </div>
            <div class="form-group">
                <label class="form-label">اسم الطبيب / العيادة (اختياري)</label>
                <input type="text" class="form-input" id="rec-doctor" placeholder="مثال: د. أحمد — عيادة الرحمة">
            </div>
            <div class="form-group">
                <label class="form-label">الموعد القادم (اختياري)</label>
                <input type="date" class="form-input" id="rec-next">
            </div>
            <div class="form-group">
                <label class="form-label">الملاحظات</label>
                <textarea class="form-input contact-textarea" id="rec-notes" placeholder="اكتب أي ملاحظات طبية هنا..."></textarea>
            </div>

            <button class="calc-btn" onclick="addRecord()">
                <i class="fas fa-plus"></i> حفظ السجل
            </button>

            <div id="success-msg" class="success-msg">
                <i class="fas fa-check-circle"></i> تم حفظ السجل بنجاح
            </div>
        </div>

        <div class="history-box">
            <div class="history-header">
                <h3 class="calc-title" style="margin-bottom:0;">تاريخ السجلات</h3>
                <span class="records-count" id="records-count">0 سجل</span>
            </div>

            <!-- FILTER -->
            <div class="record-filter" id="recordFilter">
                <button type="button" class="filter-btn active" onclick="filterRecords('all',this)"><i class="fas fa-layer-group"></i> الكل</button>
                <button type="button" class="filter-btn" onclick="filterRecords('vaccine',this)"><i class="fas fa-syringe"></i> تطعيم</button>
                <button type="button" class="filter-btn" onclick="filterRecords('checkup',this)"><i class="fas fa-stethoscope"></i> فحص</button>
                <button type="button" class="filter-btn" onclick="filterRecords('emergency',this)"><i class="fas fa-truck-medical"></i> طوارئ</button>
            </div>

            <div class="timeline" id="timeline"></div>

            <div class="export-row">
                <button class="export-btn" onclick="exportCSV()"><i class="fas fa-download"></i> تصدير كـ CSV</button>
                <button class="export-btn danger" onclick="clearAll()"><i class="fas fa-trash"></i> حذف الكل</button>
            </div>
        </div>

    </div>
</div>

<script>
const typeLabels = {
    vaccine:    { label: '<i class="fas fa-syringe" aria-hidden="true"></i> تطعيم دوري', csv: 'تطعيم دوري', cls: 'badge-vaccine' },
    checkup:    { label: '<i class="fas fa-stethoscope" aria-hidden="true"></i> فحص عام', csv: 'فحص عام', cls: 'badge-checkup' },
    dental:     { label: '<i class="fas fa-tooth" aria-hidden="true"></i> تنظيف أسنان', csv: 'تنظيف أسنان', cls: 'badge-dental' },
    medication: { label: '<i class="fas fa-pills" aria-hidden="true"></i> دواء', csv: 'دواء', cls: 'badge-checkup' },
    surgery:    { label: '<i class="fas fa-kit-medical" aria-hidden="true"></i> إجراء', csv: 'إجراء', cls: 'badge-dental' },
    emergency:  { label: '<i class="fas fa-truck-medical" aria-hidden="true"></i> طوارئ', csv: 'طوارئ', cls: 'badge-emergency' },
    other:      { label: '<i class="fas fa-file-lines" aria-hidden="true"></i> أخرى', csv: 'أخرى', cls: 'badge-checkup' }
};

let currentFilter = 'all';

function formatDate(val) {
    if (!val) return '';
    const d = new Date(val + 'T00:00:00');
    return d.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
}

function loadRecords() { return JSON.parse(localStorage.getItem('bsees-health-records') || '[]'); }
function saveRecords(r) { localStorage.setItem('bsees-health-records', JSON.stringify(r)); }

function renderAll() {
    const records  = loadRecords();
    const timeline = document.getElementById('timeline');
    const countEl  = document.getElementById('records-count');
    const filtered = currentFilter === 'all' ? records : records.filter(r => r.type === currentFilter);

    countEl.textContent = records.length + ' سجل';
    timeline.innerHTML  = '';

    if (filtered.length === 0) {
        timeline.innerHTML = `<div class="empty-state"><i class="fas fa-notes-medical"></i><p>${records.length===0 ? 'لا توجد سجلات بعد<br>ابدأ بإضافة أول سجل لقطتك' : 'لا توجد سجلات في هذا التصنيف'}</p></div>`;
        return;
    }

    filtered.forEach((rec, idx) => {
        const realIdx = records.indexOf(rec);
        const info = typeLabels[rec.type] || typeLabels.other;
        const item = document.createElement('div');
        item.className = 'timeline-item';
        item.innerHTML = `
            <div class="timeline-item-header">
                <span class="timeline-badge ${info.cls}">${info.label}</span>
                <button class="delete-btn" onclick="deleteRecord(${realIdx})" title="حذف"><i class="fas fa-trash-alt"></i></button>
            </div>
            <span class="date">${formatDate(rec.date)}</span>
            <h4>${rec.title}</h4>
            ${rec.doctor ? `<p class="rec-doctor"><i class="fas fa-user-md"></i> ${rec.doctor}</p>` : ''}
            ${rec.notes  ? `<p>${rec.notes}</p>` : ''}
            ${rec.next   ? `<div class="next-appt"><i class="fas fa-calendar-alt"></i> الموعد القادم: <strong>${formatDate(rec.next)}</strong></div>` : ''}
        `;
        timeline.appendChild(item);
    });
}

function filterRecords(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAll();
}

function addRecord() {
    const date   = document.getElementById('rec-date').value;
    const type   = document.getElementById('rec-type').value;
    const title  = document.getElementById('rec-title').value.trim();
    const notes  = document.getElementById('rec-notes').value.trim();
    const doctor = document.getElementById('rec-doctor').value.trim();
    const next   = document.getElementById('rec-next').value;

    if (!date || !title) { alert('رجاءً أدخل التاريخ والعنوان على الأقل'); return; }

    const records = loadRecords();
    records.unshift({ date, type, title, notes, doctor, next });
    saveRecords(records);
    renderAll();

    ['rec-date','rec-title','rec-notes','rec-doctor','rec-next'].forEach(id => document.getElementById(id).value = '');

    const msg = document.getElementById('success-msg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 3000);
}

function deleteRecord(index) {
    if (!confirm('هل تريد حذف هذا السجل؟')) return;
    const records = loadRecords();
    records.splice(index, 1);
    saveRecords(records);
    renderAll();
}

function clearAll() {
    if (!confirm('هل أنت متأكد من حذف جميع السجلات؟ لا يمكن التراجع عن هذا الإجراء.')) return;
    localStorage.removeItem('bsees-health-records');
    renderAll();
}

function exportCSV() {
    const records = loadRecords();
    if (!records.length) { alert('لا توجد سجلات للتصدير'); return; }
    let csv = 'التاريخ,النوع,العنوان,الطبيب,الموعد القادم,الملاحظات\n';
    records.forEach(r => {
        const t = typeLabels[r.type] || typeLabels.other;
        csv += `"${r.date}","${t.csv}","${r.title}","${r.doctor||''}","${r.next||''}","${r.notes||''}"\n`;
    });
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent('\uFEFF' + csv);
    a.download = 'السجل-الصحي-للقط.csv';
    a.click();
}

renderAll();
</script>

<style>
.record-filter { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
.filter-btn { display:inline-flex; align-items:center; gap:6px; background:var(--bg-main); border:1.5px solid var(--border); border-radius:20px; padding:6px 16px; font-family:'Cairo',sans-serif; font-size:0.8rem; font-weight:700; color:var(--text-soft); cursor:pointer; transition:all 0.3s; }
.filter-btn.active, .filter-btn:hover { background:var(--text-main); color:var(--white); border-color:var(--text-main); }
.rec-doctor { font-size:0.78rem; color:var(--accent-dark); display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.next-appt { background:rgba(144,171,139,0.12); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:0.78rem; color:var(--text-soft); margin-top:8px; display:flex; align-items:center; gap:6px; }
.record-type-key { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:10px; padding:8px 0; opacity:0.75; }
.record-type-key span { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:8px; background:rgba(144,171,139,0.18); color:var(--accent-dark); font-size:0.75rem; }
.filter-btn i { font-size:0.78em; opacity:0.9; }
.export-row { display:flex; gap:12px; margin-top:20px; padding-top:20px; border-top:1px solid var(--border-soft); }
.export-btn { flex:1; background:var(--bg-main); border:1.5px solid var(--border); border-radius:10px; padding:10px; font-family:'Cairo',sans-serif; font-size:0.82rem; font-weight:700; color:var(--text-soft); cursor:pointer; transition:all 0.3s; display:flex; align-items:center; justify-content:center; gap:6px; }
.export-btn:hover { background:var(--accent-dark); color:var(--white); border-color:var(--accent-dark); }
.export-btn.danger:hover { background:#3B4953; border-color:#3B4953; }
</style>
</body>
</html>
